<h2>Chat Simulator</h2>

<div class="chat-window" #chatWindow>
  @for (msg of messages; track $index) {
    <div [class.user]="msg.sender === 'user'" [class.bot]="msg.sender === 'bot'">
      <strong>{{ msg.sender }}:</strong> {{ msg.text }}
    </div>
  }
  @if (isBotTyping) {
    <div class="bot typing">
      <span class="dots">
        <span>.</span><span>.</span><span>.</span>
      </span>
    </div>
  }
</div>

<div class="chat-input-wrapper">
  <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Type a message" />
  <button (click)="sendMessage()">Send</button>
</div>
