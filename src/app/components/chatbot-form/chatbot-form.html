<h2>Create Chatbot</h2>

<form [formGroup]="chatbotForm" (ngSubmit)="onSubmit()">

  <div>
    <label>Name:</label>
    <input type="text" formControlName="name" />
    @if (chatbotForm.get('name')?.invalid && chatbotForm.get('name')?.touched) {
        <div>Name is required</div>
    }
  </div>

  <div>
    <label>Personality: {{ chatbotForm.value.personality }}</label>
    <input 
      type="range" 
      min="0" 
      max="1" 
      step="0.1"
      formControlName="personality"
    />
  </div>

  <div>
    <label>Description:</label>
    <textarea formControlName="description"></textarea>
  </div>

  <button type="submit" [disabled]="chatbotForm.invalid">
    Save Chatbot
  </button>

</form>
